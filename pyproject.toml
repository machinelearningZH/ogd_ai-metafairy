[project]
name = "ogd-ai-metafairy"
version = "0.2.0"
description = "An app that helps you easily create high quality dataset descriptions – with a little help from AI. "
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "openai>=2.29.0",
    "pandas>=2.3.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.55.0",
]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]
# eMudhra/emSign: remove only certifi exceptions once artifacts age seven days.
exclude-newer-package = { certifi = false }
exclude-newer = "7 days"